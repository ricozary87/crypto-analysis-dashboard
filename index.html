<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crypto Technical Dashboard</title>
    <meta name="description" content="Professional cryptocurrency trading dashboard with advanced technical analysis capabilities" />
    <meta name="keywords" content="crypto, trading, technical analysis, charts, dashboard, bitcoin, ethereum, candlestick" />
    
    <!-- Preconnect to improve performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Chart.js financial plugin -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.2.1/dist/chartjs-chart-financial.min.js"></script>
    
    <style>
      /* Critical CSS for initial load */
      body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        background-color: #0a0a0a;
        color: #e0e0e0;
        overflow-x: hidden;
      }
      
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      
      /* Loading spinner */
      .loading-spinner {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 9999;
      }
      
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #2a2a2a;
        border-top: 4px solid #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* Hide scrollbar but keep functionality */
      ::-webkit-scrollbar {
        width: 6px;
      }
      
      ::-webkit-scrollbar-track {
        background: #1a1a1a;
      }
      
      ::-webkit-scrollbar-thumb {
        background: #2a2a2a;
        border-radius: 3px;
      }
      
      ::-webkit-scrollbar-thumb:hover {
        background: #3a3a3a;
      }
      
      /* Responsive design */
      @media (max-width: 768px) {
        body {
          font-size: 14px;
        }
      }
      
      /* Dark mode chart backgrounds */
      .chartjs-render-monitor {
        background: transparent !important;
      }
    </style>
  </head>
  <body>
    <!-- Loading spinner -->
    <div id="loading" class="loading-spinner">
      <div class="spinner"></div>
      <p style="margin-top: 16px; text-align: center; color: #9ca3af;">Loading Dashboard...</p>
    </div>
    
    <!-- Root element -->
    <div id="root"></div>
    
    <!-- Vite dev script -->
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Remove loading spinner once React loads -->
    <script>
      // Remove loading spinner when React app loads
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loading = document.getElementById('loading');
          if (loading) {
            loading.style.opacity = '0';
            loading.style.transition = 'opacity 0.3s ease';
            setTimeout(() => {
              loading.remove();
            }, 300);
          }
        }, 1000);
      });
      
      // Handle errors
      window.addEventListener('error', (event) => {
        console.error('Application error:', event.error);
      });
      
      // Service worker registration for PWA capabilities (optional)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
