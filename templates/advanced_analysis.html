<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Analysis - Crypto Trading Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background-color: #1a1a1a;
            border-bottom: 1px solid #333;
        }
        .card {
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
        }
        .card-header {
            background-color: #2a2a2a;
            border-bottom: 1px solid #333;
            border-radius: 12px 12px 0 0;
        }
        .btn-primary {
            background-color: #0d6efd;
            border-color: #0d6efd;
        }
        .btn-primary:hover {
            background-color: #0b5ed7;
            border-color: #0a58ca;
        }
        .form-control, .form-select {
            background-color: #2a2a2a;
            border: 1px solid #404040;
            color: #ffffff;
        }
        .form-control:focus, .form-select:focus {
            background-color: #2a2a2a;
            border-color: #0d6efd;
            color: #ffffff;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
        }
        .analysis-container {
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
        .signal-badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8em;
            font-weight: bold;
        }
        .signal-buy {
            background-color: #10b981;
            color: #ffffff;
        }
        .signal-sell {
            background-color: #ef4444;
            color: #ffffff;
        }
        .signal-neutral {
            background-color: #6b7280;
            color: #ffffff;
        }
        .smc-pattern {
            background-color: #2a2a2a;
            border: 1px solid #404040;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .confidence-bar {
            background-color: #404040;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }
        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #ef4444 0%, #f59e0b 50%, #10b981 100%);
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand text-white" href="/">
                <i class="fas fa-chart-line me-2"></i>
                Crypto Trading Dashboard
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white" href="/">Home</a>
                <a class="nav-link text-white" href="/react-dashboard">React Dashboard</a>
                <a class="nav-link text-white" href="/professional-dashboard">Professional</a>
                <a class="nav-link text-white active" href="/advanced-analysis">Advanced Analysis</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12">
                <h2 class="text-white mb-4">
                    <i class="fas fa-microscope me-2"></i>
                    Advanced Trading Analysis
                </h2>
            </div>
        </div>

        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-cogs me-2"></i>
                            Analysis Settings
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-3">
                                <label for="symbolSelect" class="form-label">Trading Pair</label>
                                <select class="form-select" id="symbolSelect">
                                    <option value="BTC-USDT">BTC/USDT</option>
                                    <option value="ETH-USDT">ETH/USDT</option>
                                    <option value="SOL-USDT">SOL/USDT</option>
                                    <option value="TIA-USDT">TIA/USDT</option>
                                    <option value="RENDER-USDT">RENDER/USDT</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="timeframeSelect" class="form-label">Timeframe</label>
                                <select class="form-select" id="timeframeSelect">
                                    <option value="5m">5 Minutes</option>
                                    <option value="15m">15 Minutes</option>
                                    <option value="1h" selected>1 Hour</option>
                                    <option value="4h">4 Hours</option>
                                    <option value="1d">1 Day</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="analysisType" class="form-label">Analysis Type</label>
                                <select class="form-select" id="analysisType">
                                    <option value="comprehensive" selected>Comprehensive</option>
                                    <option value="smc">SMC Only</option>
                                    <option value="technical">Technical Only</option>
                                    <option value="ai">AI Analysis</option>
                                </select>
                            </div>
                            <div class="col-md-3 d-flex align-items-end">
                                <button class="btn btn-primary w-100" onclick="runAnalysis()">
                                    <i class="fas fa-play me-2"></i>
                                    Run Analysis
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="analysis-container" id="analysisResults" style="display: none;">
            <div class="loading" id="loadingSpinner">
                <i class="fas fa-spinner fa-spin fa-2x"></i>
                <p class="mt-2">Running advanced analysis...</p>
            </div>
            <div id="analysisContent" style="display: none;">
                <!-- Analysis results will be displayed here -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function runAnalysis() {
            const symbol = document.getElementById('symbolSelect').value;
            const timeframe = document.getElementById('timeframeSelect').value;
            const analysisType = document.getElementById('analysisType').value;
            
            // Show loading
            document.getElementById('analysisResults').style.display = 'block';
            document.getElementById('loadingSpinner').style.display = 'block';
            document.getElementById('analysisContent').style.display = 'none';
            
            try {
                // Call API endpoint
                const response = await fetch(`/api/analyze/${symbol}?timeframe=${timeframe}&type=${analysisType}`);
                const data = await response.json();
                
                if (response.ok && data.success) {
                    displayAnalysisResults(data);
                } else {
                    displayError(data.error || 'Analysis failed');
                }
            } catch (error) {
                console.error('Analysis error:', error);
                displayError('Network error occurred');
            } finally {
                document.getElementById('loadingSpinner').style.display = 'none';
            }
        }
        
        function displayAnalysisResults(data) {
            const content = document.getElementById('analysisContent');
            
            let html = `
                <div class="row">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h6 class="mb-0">
                                    <i class="fas fa-chart-bar me-2"></i>
                                    Market Overview
                                </h6>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-6">
                                        <small class="text-muted">Current Price</small>
                                        <h5 class="text-success">$${data.current_price || 'N/A'}</h5>
                                    </div>
                                    <div class="col-6">
                                        <small class="text-muted">24h Change</small>
                                        <h5 class="${data.price_change_24h >= 0 ? 'text-success' : 'text-danger'}">
                                            ${data.price_change_24h || 'N/A'}%
                                        </h5>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h6 class="mb-0">
                                    <i class="fas fa-signal me-2"></i>
                                    Trading Signal
                                </h6>
                            </div>
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center">
                                    <span class="signal-badge ${getSignalClass(data.signal_action)}">
                                        ${data.signal_action || 'NEUTRAL'}
                                    </span>
                                    <div class="text-end">
                                        <small class="text-muted">Confidence</small>
                                        <div class="confidence-bar mt-1" style="width: 100px;">
                                            <div class="confidence-fill" style="width: ${(data.confidence || 0) * 100}%"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            // Add SMC Patterns if available
            if (data.smc_patterns_detected) {
                html += `
                    <div class="card mt-3">
                        <div class="card-header">
                            <h6 class="mb-0">
                                <i class="fas fa-brain me-2"></i>
                                Smart Money Concepts
                            </h6>
                        </div>
                        <div class="card-body">
                            <div class="row">
                `;
                
                for (const [pattern, count] of Object.entries(data.smc_patterns_detected)) {
                    html += `
                        <div class="col-md-6">
                            <div class="smc-pattern">
                                <div class="d-flex justify-content-between">
                                    <span>${pattern}</span>
                                    <span class="badge bg-primary">${count}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }
                
                html += `
                            </div>
                        </div>
                    </div>
                `;
            }
            
            // Add formatted analysis if available
            if (data.formatted_analysis) {
                html += `
                    <div class="card mt-3">
                        <div class="card-header">
                            <h6 class="mb-0">
                                <i class="fas fa-file-alt me-2"></i>
                                Detailed Analysis
                            </h6>
                        </div>
                        <div class="card-body">
                            <div class="analysis-text">
                                ${data.formatted_analysis.replace(/\n/g, '<br>')}
                            </div>
                        </div>
                    </div>
                `;
            }
            
            content.innerHTML = html;
            content.style.display = 'block';
        }
        
        function displayError(message) {
            const content = document.getElementById('analysisContent');
            content.innerHTML = `
                <div class="alert alert-danger" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    ${message}
                </div>
            `;
            content.style.display = 'block';
        }
        
        function getSignalClass(action) {
            switch (action) {
                case 'BUY':
                    return 'signal-buy';
                case 'SELL':
                    return 'signal-sell';
                default:
                    return 'signal-neutral';
            }
        }
        
        // Auto-run analysis on page load
        document.addEventListener('DOMContentLoaded', function() {
            runAnalysis();
        });
    </script>
</body>
</html>
