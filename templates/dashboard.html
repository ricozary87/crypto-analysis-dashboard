<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crypto AI Trading Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    body {
      background-color: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    /* Enhanced text readability */
    .ai-analysis-text {
      color: #ffffff !important;
      opacity: 1 !important;
      font-weight: 600 !important;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      font-size: 14px !important;
    }
    
    /* Better contrast for all text */
    #aiAnalysis, #enhancedAnalysis {
      color: #ffffff !important;
      opacity: 1 !important;
      font-weight: 600 !important;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      font-size: 14px !important;
    }
    .navbar {
      background-color: #161b22;
      border-bottom: 1px solid #30363d;
    }
    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
    }
    .btn-primary {
      background-color: #238636;
      border-color: #238636;
    }
    .btn-primary:hover {
      background-color: #2ea043;
      border-color: #2ea043;
    }
    .signal-badge {
      font-size: 0.8rem;
      padding: 4px 8px;
    }
    .chart-container {
      background-color: #1a1a1a;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand text-white" href="#">
        <i class="fas fa-chart-line me-2"></i> AI Crypto Dashboard
      </a>
    </div>
  </nav>

  <div class="container py-4">
    <div class="row mb-3">
      <div class="col-md-6">
        <input type="text" class="form-control" id="symbolInput" placeholder="Enter Symbol (e.g., BTC-USDT)" />
      </div>
      <div class="col-md-2">
        <button class="btn btn-primary w-100" onclick="analyze()">Analyze</button>
      </div>
    </div>

    <div id="loading" class="alert alert-info d-none">⏳ Analyzing, please wait...</div>
    <div id="error" class="alert alert-danger d-none"></div>

    <div id="results" class="d-none">
      <div class="card mb-4">
        <div class="card-body">
          <h4>
            <span id="symbol"></span> — 
            <span class="badge bg-secondary signal-badge" id="signal"></span>
          </h4>
          <p><b>Current Price:</b> $<span id="price"></span></p>
          <p><b>24h Change:</b> <span id="priceChange"></span>%</p>
          <p><b>RSI:</b> <span id="rsi"></span></p>
          <p><b>MACD:</b> <span id="macd"></span></p>
          
          <!-- AI Analysis Section -->
          <div class="mt-4">
            <h5><i class="fas fa-robot me-2"></i>AI-Powered Analysis</h5>
            <div id="aiAnalysis" class="p-3" style="background-color: #2d3748; border-radius: 8px; white-space: pre-wrap; font-family: monospace; line-height: 1.6; color: #ffffff; opacity: 1; font-weight: 500;"></div>
          </div>
          
          <!-- Enhanced AI Analysis Section -->
          <div class="mt-4">
            <h5><i class="fas fa-brain me-2"></i>Advanced AI Insights</h5>
            <div id="enhancedAnalysis" class="p-3" style="background-color: #1a202c; border-radius: 8px; white-space: pre-wrap; font-family: monospace; line-height: 1.6; color: #ffffff; opacity: 1; font-weight: 500; text-shadow: 0 1px 2px rgba(0,0,0,0.8);"></div>
          </div>
        </div>
      </div>

      <div class="chart-container">
        <div id="priceChart" style="height:400px;"></div>
      </div>
    </div>
  </div>

  <script>
    // Format timestamp safely to prevent JavaScript date parsing errors
    function formatTimestamp(timestamp) {
        try {
            // Handle null/undefined
            if (!timestamp) return new Date().toISOString();
            
            // Handle string timestamps
            if (typeof timestamp === 'string') {
                if (timestamp.includes('T') && timestamp.includes('Z')) {
                    return timestamp; // Already valid ISO
                }
                const numTimestamp = parseFloat(timestamp);
                if (!isNaN(numTimestamp) && numTimestamp > 0) {
                    timestamp = numTimestamp;
                } else {
                    console.warn(`Invalid timestamp string: ${timestamp}`);
                    return new Date().toISOString();
                }
            }
            
            // Handle number timestamps
            if (typeof timestamp === 'number') {
                // Filter out invalid small numbers
                if (timestamp < 1000000000) {
                    console.warn(`Invalid timestamp number: ${timestamp}`);
                    return new Date().toISOString();
                }
                
                // Handle both seconds and milliseconds
                const date = timestamp > 10000000000 ? new Date(timestamp) : new Date(timestamp * 1000);
                
                // Validate the date
                if (isNaN(date.getTime())) {
                    console.warn(`Invalid date created from timestamp: ${timestamp}`);
                    return new Date().toISOString();
                }
                
                return date.toISOString();
            }
            
            // Fallback for other types
            console.warn(`Unexpected timestamp type: ${typeof timestamp}, value: ${timestamp}`);
            return new Date().toISOString();
            
        } catch (error) {
            console.error(`Error formatting timestamp: ${error}, timestamp: ${timestamp}`);
            return new Date().toISOString();
        }
    }

    async function analyze() {
      const symbol = document.getElementById("symbolInput").value.trim().toUpperCase();
      if (!symbol) return;

      document.getElementById("loading").classList.remove("d-none");
      document.getElementById("error").classList.add("d-none");
      document.getElementById("results").classList.add("d-none");

      try {
        const res = await fetch(`/api/analyze/${symbol}`);
        const data = await res.json();
        if (!data.success) throw new Error(data.error || "Failed");

        // Display comprehensive analysis
        document.getElementById("symbol").textContent = data.symbol;
        document.getElementById("signal").textContent = data.hasSignal ? "Active Signal" : "No Signal";
        document.getElementById("price").textContent = data.currentPrice.toFixed(2);
        document.getElementById("priceChange").textContent = data.priceChange24h.toFixed(2);
        document.getElementById("rsi").textContent = data.rsiValue.toFixed(1);
        document.getElementById("macd").textContent = data.macdValue.toFixed(4);
        
        // Display comprehensive AI analysis with enhanced styling
        const aiAnalysisElement = document.getElementById("aiAnalysis");
        aiAnalysisElement.textContent = data.formattedAnalysis;
        aiAnalysisElement.className += " ai-analysis-text";
        
        // Get enhanced AI analysis
        fetch(`/api/enhanced-ai/narrative/${data.symbol}`)
          .then(res => res.json())
          .then(aiData => {
            const enhancedElement = document.getElementById("enhancedAnalysis");
            if (aiData.success && aiData.narrative) {
              enhancedElement.textContent = aiData.narrative;
            } else {
              enhancedElement.textContent = "🤖 Enhanced AI analysis generating...";
            }
            enhancedElement.className += " ai-analysis-text";
          })
          .catch(err => {
            const enhancedElement = document.getElementById("enhancedAnalysis");
            enhancedElement.textContent = "🤖 AI analysis temporarily unavailable";
            enhancedElement.className += " ai-analysis-text";
          });

        // Create professional candlestick chart
        if (data.chart && data.chart.length > 0) {
          const chartData = data.chart.map((c, index) => ({
            x: index,  // Use index instead of timestamp to avoid parsing issues
            open: c.open,
            high: c.high,
            low: c.low,
            close: c.close,
            volume: c.volume
          }));
          
          Plotly.newPlot('priceChart', [{
            x: chartData.map(c => c.x),
            open: chartData.map(c => c.open),
            high: chartData.map(c => c.high),
            low: chartData.map(c => c.low),
            close: chartData.map(c => c.close),
            type: 'candlestick',
            name: `${data.symbol} Price`,
            increasing: {line: {color: '#00ff88'}},
            decreasing: {line: {color: '#ff4444'}}
          }], {
            paper_bgcolor: '#1a1a1a',
            plot_bgcolor: '#1a1a1a',
            font: {color: '#e6edf3'},
            xaxis: {title: 'Time Period', showgrid: false},
            yaxis: {title: 'Price (USDT)', showgrid: true, gridcolor: '#333'},
            title: {
              text: `${data.symbol} Price Analysis`,
              font: {color: '#e6edf3', size: 16}
            }
          });
        }

        document.getElementById("results").classList.remove("d-none");
      } catch (err) {
        document.getElementById("error").textContent = err.message;
        document.getElementById("error").classList.remove("d-none");
      } finally {
        document.getElementById("loading").classList.add("d-none");
      }
    }
  </script>
</body>
</html>
