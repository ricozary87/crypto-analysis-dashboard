<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crypto AI Trading Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    body {
      background-color: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .navbar {
      background-color: #161b22;
      border-bottom: 1px solid #30363d;
    }
    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
    }
    .btn-primary {
      background-color: #238636;
      border-color: #238636;
    }
    .btn-primary:hover {
      background-color: #2ea043;
      border-color: #2ea043;
    }
    .signal-badge {
      font-size: 0.8rem;
      padding: 4px 8px;
    }
    .chart-container {
      background-color: #1a1a1a;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand text-white" href="#">
        <i class="fas fa-chart-line me-2"></i> AI Crypto Dashboard
      </a>
    </div>
  </nav>

  <div class="container py-4">
    <div class="row mb-3">
      <div class="col-md-6">
        <input type="text" class="form-control" id="symbolInput" placeholder="Enter Symbol (e.g., BTC-USDT)" />
      </div>
      <div class="col-md-2">
        <button class="btn btn-primary w-100" onclick="analyze()">Analyze</button>
      </div>
    </div>

    <div id="loading" class="alert alert-info d-none">⏳ Analyzing, please wait...</div>
    <div id="error" class="alert alert-danger d-none"></div>

    <div id="results" class="d-none">
      <div class="card mb-4">
        <div class="card-body">
          <h4>
            <span id="symbol"></span> — 
            <span class="badge bg-secondary signal-badge" id="signal"></span>
          </h4>
          <p><b>Current Price:</b> $<span id="price"></span></p>
          <p><b>Trend:</b> <span id="trend"></span></p>
          <p><b>Confidence:</b> <span id="confidence"></span>%</p>
          <p><b>Summary:</b> <span id="summary"></span></p>
        </div>
      </div>

      <div class="chart-container">
        <div id="priceChart" style="height:400px;"></div>
      </div>
    </div>
  </div>

  <script>
    // Format timestamp safely to prevent JavaScript date parsing errors
    function formatTimestamp(timestamp) {
        try {
            // Handle null/undefined
            if (!timestamp) return new Date().toISOString();
            
            // Handle string timestamps
            if (typeof timestamp === 'string') {
                if (timestamp.includes('T') && timestamp.includes('Z')) {
                    return timestamp; // Already valid ISO
                }
                const numTimestamp = parseFloat(timestamp);
                if (!isNaN(numTimestamp) && numTimestamp > 0) {
                    timestamp = numTimestamp;
                } else {
                    console.warn(`Invalid timestamp string: ${timestamp}`);
                    return new Date().toISOString();
                }
            }
            
            // Handle number timestamps
            if (typeof timestamp === 'number') {
                // Filter out invalid small numbers
                if (timestamp < 1000000000) {
                    console.warn(`Invalid timestamp number: ${timestamp}`);
                    return new Date().toISOString();
                }
                
                // Handle both seconds and milliseconds
                const date = timestamp > 10000000000 ? new Date(timestamp) : new Date(timestamp * 1000);
                
                // Validate the date
                if (isNaN(date.getTime())) {
                    console.warn(`Invalid date created from timestamp: ${timestamp}`);
                    return new Date().toISOString();
                }
                
                return date.toISOString();
            }
            
            // Fallback for other types
            console.warn(`Unexpected timestamp type: ${typeof timestamp}, value: ${timestamp}`);
            return new Date().toISOString();
            
        } catch (error) {
            console.error(`Error formatting timestamp: ${error}, timestamp: ${timestamp}`);
            return new Date().toISOString();
        }
    }

    async function analyze() {
      const symbol = document.getElementById("symbolInput").value.trim().toUpperCase();
      if (!symbol) return;

      document.getElementById("loading").classList.remove("d-none");
      document.getElementById("error").classList.add("d-none");
      document.getElementById("results").classList.add("d-none");

      try {
        const res = await fetch(`/api/analyze/${symbol}`);
        const data = await res.json();
        if (!data.success) throw new Error(data.error || "Failed");

        const analysis = data.analysis;
        document.getElementById("symbol").textContent = analysis.symbol;
        document.getElementById("signal").textContent = analysis.signals.action;
        document.getElementById("price").textContent = analysis.current_price.toFixed(2);
        document.getElementById("trend").textContent = analysis.trend;
        document.getElementById("confidence").textContent = (analysis.signals.confidence * 100).toFixed(1);
        document.getElementById("summary").textContent = analysis.summary;

        Plotly.newPlot('priceChart', [{
          x: analysis.chart.map(c => formatTimestamp(c.timestamp)),
          open: analysis.chart.map(c => c.open),
          high: analysis.chart.map(c => c.high),
          low: analysis.chart.map(c => c.low),
          close: analysis.chart.map(c => c.close),
          type: 'candlestick',
          increasing: {line: {color: 'green'}},
          decreasing: {line: {color: 'red'}}
        }], {
          paper_bgcolor: '#1a1a1a',
          plot_bgcolor: '#1a1a1a',
          font: {color: '#e6edf3'},
          xaxis: {title: 'Time'},
          yaxis: {title: 'Price (USDT)'}
        });

        document.getElementById("results").classList.remove("d-none");
      } catch (err) {
        document.getElementById("error").textContent = err.message;
        document.getElementById("error").classList.remove("d-none");
      } finally {
        document.getElementById("loading").classList.add("d-none");
      }
    }
  </script>
</body>
</html>
