<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis History - Crypto Trading System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6c5ce7;
            --secondary-color: #a29bfe;
            --accent-color: #fd79a8;
            --success-color: #00b894;
            --warning-color: #fdcb6e;
            --danger-color: #e17055;
            --dark-bg: #2d3436;
            --card-bg: #636e72;
            --text-light: #ddd;
        }

        body {
            background: linear-gradient(135deg, var(--dark-bg), #74b9ff);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .navbar {
            background: rgba(45, 52, 54, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--primary-color);
        }

        .card {
            background: rgba(99, 110, 114, 0.9);
            border: 1px solid rgba(108, 92, 231, 0.3);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .btn-primary {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            border: none;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.4);
        }

        .badge {
            font-size: 0.8em;
            padding: 0.5em 0.8em;
            border-radius: 20px;
        }

        .table-dark {
            background: rgba(45, 52, 54, 0.8);
            border-radius: 10px;
        }

        .table-dark th {
            border-color: var(--primary-color);
            background: rgba(108, 92, 231, 0.3);
        }

        .table-dark td {
            border-color: rgba(108, 92, 231, 0.2);
        }

        .loading {
            text-align: center;
            padding: 2rem;
        }

        .spinner-border {
            width: 3rem;
            height: 3rem;
            border-color: var(--primary-color);
            border-right-color: transparent;
        }

        .signal-bullish {
            color: var(--success-color);
        }

        .signal-bearish {
            color: var(--danger-color);
        }

        .confidence-high {
            color: var(--success-color);
        }

        .confidence-medium {
            color: var(--warning-color);
        }

        .confidence-low {
            color: var(--danger-color);
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">
                <i class="fas fa-chart-line me-2"></i>
                Crypto Trading System
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/dashboard">
                    <i class="fas fa-home me-1"></i>Dashboard
                </a>
                <a class="nav-link" href="/professional-dashboard">
                    <i class="fas fa-chart-area me-1"></i>Professional
                </a>
                <a class="nav-link active" href="/analysis-history">
                    <i class="fas fa-history me-1"></i>History
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0">
                            <i class="fas fa-history me-2"></i>
                            Analysis History
                        </h4>
                    </div>
                    <div class="card-body">
                        <!-- Symbol Filter -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="symbolFilter" class="form-label">Filter by Symbol:</label>
                                <select id="symbolFilter" class="form-select">
                                    <option value="">All Symbols</option>
                                    <option value="BTC">BTC-USDT</option>
                                    <option value="ETH">ETH-USDT</option>
                                    <option value="SOL">SOL-USDT</option>
                                    <option value="TIA">TIA-USDT</option>
                                    <option value="RENDER">RENDER-USDT</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="limitFilter" class="form-label">Number of Records:</label>
                                <select id="limitFilter" class="form-select">
                                    <option value="20">Last 20</option>
                                    <option value="50">Last 50</option>
                                    <option value="100">Last 100</option>
                                </select>
                            </div>
                        </div>

                        <!-- Loading State -->
                        <div id="loadingState" class="loading">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-2">Loading analysis history...</p>
                        </div>

                        <!-- History Table -->
                        <div id="historyTable" class="d-none">
                            <div class="table-responsive">
                                <table class="table table-dark table-hover">
                                    <thead>
                                        <tr>
                                            <th>Date/Time</th>
                                            <th>Symbol</th>
                                            <th>Price</th>
                                            <th>Change 24h</th>
                                            <th>Signal</th>
                                            <th>Confidence</th>
                                            <th>RSI</th>
                                            <th>Trend</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody id="historyTableBody">
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- Empty State -->
                        <div id="emptyState" class="text-center p-4 d-none">
                            <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
                            <h5>No Analysis History Found</h5>
                            <p class="text-muted">No historical analysis data is available for the selected criteria.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Analysis Detail Modal -->
    <div class="modal fade" id="analysisDetailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content bg-dark">
                <div class="modal-header">
                    <h5 class="modal-title">Analysis Detail</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="analysisDetailBody">
                    <!-- Detail content will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentHistoryData = [];

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            loadAnalysisHistory();
            
            // Set up event listeners
            document.getElementById('symbolFilter').addEventListener('change', loadAnalysisHistory);
            document.getElementById('limitFilter').addEventListener('change', loadAnalysisHistory);
        });

        function loadAnalysisHistory() {
            const symbol = document.getElementById('symbolFilter').value;
            const limit = document.getElementById('limitFilter').value;
            
            showLoading();
            
            let url = '/api/analysis/history';
            if (symbol) {
                url += `/${symbol}?limit=${limit}`;
            } else {
                // For all symbols, we'll call individual endpoints
                loadAllSymbolsHistory(parseInt(limit));
                return;
            }

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        displayHistory(data.history);
                    } else {
                        showError('Error loading history: ' + data.error);
                    }
                })
                .catch(error => {
                    showError('Error loading history: ' + error.message);
                });
        }

        function loadAllSymbolsHistory(limit) {
            const symbols = ['BTC', 'ETH', 'SOL', 'TIA', 'RENDER'];
            const promises = symbols.map(symbol => 
                fetch(`/api/analysis/history/${symbol}?limit=${Math.ceil(limit/5)}`)
                    .then(response => response.json())
                    .then(data => data.success ? data.history : [])
                    .catch(() => [])
            );

            Promise.all(promises)
                .then(results => {
                    const allHistory = results.flat();
                    allHistory.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                    displayHistory(allHistory.slice(0, limit));
                })
                .catch(error => {
                    showError('Error loading history: ' + error.message);
                });
        }

        function displayHistory(history) {
            hideLoading();
            
            if (history.length === 0) {
                showEmptyState();
                return;
            }

            currentHistoryData = history;
            const tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = '';

            history.forEach(analysis => {
                const row = createHistoryRow(analysis);
                tbody.appendChild(row);
            });

            showTable();
        }

        function createHistoryRow(analysis) {
            const row = document.createElement('tr');
            
            const date = new Date(analysis.created_at);
            const dateStr = date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
            
            const signalClass = analysis.signal_action === 'BUY' ? 'signal-bullish' : 
                               analysis.signal_action === 'SELL' ? 'signal-bearish' : '';
            
            const confidenceClass = analysis.signal_confidence > 70 ? 'confidence-high' :
                                  analysis.signal_confidence > 50 ? 'confidence-medium' : 'confidence-low';

            row.innerHTML = `
                <td>${dateStr}</td>
                <td><span class="badge bg-primary">${analysis.symbol}</span></td>
                <td>$${analysis.current_price ? analysis.current_price.toFixed(2) : 'N/A'}</td>
                <td class="${analysis.price_change_24h > 0 ? 'text-success' : 'text-danger'}">
                    ${analysis.price_change_24h ? analysis.price_change_24h.toFixed(2) : '0.00'}%
                </td>
                <td class="${signalClass}">
                    ${analysis.has_signal ? analysis.signal_action : 'NONE'}
                </td>
                <td class="${confidenceClass}">
                    ${analysis.signal_confidence ? analysis.signal_confidence.toFixed(1) : '0.0'}%
                </td>
                <td>${analysis.rsi_value ? analysis.rsi_value.toFixed(1) : 'N/A'}</td>
                <td>
                    <span class="badge ${analysis.ema_trend === 'bullish' ? 'bg-success' : 
                                       analysis.ema_trend === 'bearish' ? 'bg-danger' : 'bg-secondary'}">
                        ${analysis.ema_trend || 'NEUTRAL'}
                    </span>
                </td>
                <td>
                    <button class="btn btn-sm btn-outline-primary" onclick="viewAnalysisDetail(${analysis.id})">
                        <i class="fas fa-eye"></i> View
                    </button>
                </td>
            `;

            return row;
        }

        function viewAnalysisDetail(analysisId) {
            fetch(`/api/analysis/detail/${analysisId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        displayAnalysisDetail(data.analysis);
                    } else {
                        alert('Error loading analysis detail: ' + data.error);
                    }
                })
                .catch(error => {
                    alert('Error loading analysis detail: ' + error.message);
                });
        }

        function displayAnalysisDetail(analysis) {
            const modalBody = document.getElementById('analysisDetailBody');
            modalBody.innerHTML = `
                <div class="row">
                    <div class="col-md-6">
                        <h6>Basic Information</h6>
                        <p><strong>Symbol:</strong> ${analysis.symbol}</p>
                        <p><strong>Date:</strong> ${new Date(analysis.created_at).toLocaleString()}</p>
                        <p><strong>Price:</strong> $${analysis.current_price ? analysis.current_price.toFixed(2) : 'N/A'}</p>
                        <p><strong>24h Change:</strong> ${analysis.price_change_24h ? analysis.price_change_24h.toFixed(2) : '0.00'}%</p>
                    </div>
                    <div class="col-md-6">
                        <h6>Signal Information</h6>
                        <p><strong>Has Signal:</strong> ${analysis.has_signal ? 'Yes' : 'No'}</p>
                        <p><strong>Action:</strong> ${analysis.signal_action || 'NONE'}</p>
                        <p><strong>Confidence:</strong> ${analysis.signal_confidence ? analysis.signal_confidence.toFixed(1) : '0.0'}%</p>
                        <p><strong>Entry Price:</strong> $${analysis.entry_price ? analysis.entry_price.toFixed(2) : 'N/A'}</p>
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-12">
                        <h6>Technical Analysis</h6>
                        <div class="row">
                            <div class="col-md-4">
                                <p><strong>RSI:</strong> ${analysis.rsi_value ? analysis.rsi_value.toFixed(1) : 'N/A'}</p>
                                <p><strong>EMA Trend:</strong> ${analysis.ema_trend || 'NEUTRAL'}</p>
                                <p><strong>Volume Trend:</strong> ${analysis.volume_trend || 'NEUTRAL'}</p>
                            </div>
                            <div class="col-md-4">
                                <p><strong>Stop Loss:</strong> $${analysis.stop_loss ? analysis.stop_loss.toFixed(2) : 'N/A'}</p>
                                <p><strong>Take Profit 1:</strong> $${analysis.take_profit_1 ? analysis.take_profit_1.toFixed(2) : 'N/A'}</p>
                                <p><strong>Take Profit 2:</strong> $${analysis.take_profit_2 ? analysis.take_profit_2.toFixed(2) : 'N/A'}</p>
                            </div>
                            <div class="col-md-4">
                                <p><strong>Take Profit 3:</strong> $${analysis.take_profit_3 ? analysis.take_profit_3.toFixed(2) : 'N/A'}</p>
                                <p><strong>SMC Patterns:</strong> ${analysis.smc_patterns ? Object.keys(analysis.smc_patterns).length : 0}</p>
                            </div>
                        </div>
                    </div>
                </div>
                ${analysis.formatted_analysis ? `
                <div class="row mt-3">
                    <div class="col-12">
                        <h6>Formatted Analysis</h6>
                        <div class="card bg-secondary">
                            <div class="card-body">
                                <pre style="white-space: pre-wrap; font-family: inherit;">${analysis.formatted_analysis}</pre>
                            </div>
                        </div>
                    </div>
                </div>
                ` : ''}
            `;

            const modal = new bootstrap.Modal(document.getElementById('analysisDetailModal'));
            modal.show();
        }

        function showLoading() {
            document.getElementById('loadingState').classList.remove('d-none');
            document.getElementById('historyTable').classList.add('d-none');
            document.getElementById('emptyState').classList.add('d-none');
        }

        function hideLoading() {
            document.getElementById('loadingState').classList.add('d-none');
        }

        function showTable() {
            document.getElementById('historyTable').classList.remove('d-none');
            document.getElementById('emptyState').classList.add('d-none');
        }

        function showEmptyState() {
            document.getElementById('historyTable').classList.add('d-none');
            document.getElementById('emptyState').classList.remove('d-none');
        }

        function showError(message) {
            hideLoading();
            alert(message);
        }
    </script>
</body>
</html>
